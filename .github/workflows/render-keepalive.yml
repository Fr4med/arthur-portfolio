name: Render keep-alive

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check Arthur's Render server
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 5 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            'https://arthur-portfolio-yi47.onrender.com/health' \
            --output /tmp/arthur-health.json
          jq -e '.status == "ok"' /tmp/arthur-health.json
